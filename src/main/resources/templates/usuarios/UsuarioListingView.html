<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Listado de Usuarios</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

<body>

	<header>
		<h1>Listado de Usuarios</h1>
	</header>

	<div class="contenedor">
		<div class="barra-acciones">
			<a th:href="@{/dashboard}" class="btn btn-primary">← Dashboard</a>
			<a th:href="@{/usuarios/nuevo}" class="btn btn-primary">+ Añadir usuarios</a>
		</div>

		<table>
			<thead>
				<tr>
					<!-- ID eliminado -->
					<th>Nombre</th>
					<th>Apellidos</th>
					<th>Email</th>
					<th>Acciones</th>
				</tr>
			</thead>
			<tbody>
				<tr th:if="${#lists.isEmpty(usuarios)}">
					<td colspan="4" class="vacio">No hay usuarios registrados.</td>
				</tr>
				<tr th:each="usuario : ${usuarios}">
					<td th:text="${usuario.nombre}"></td>
					<td th:text="${usuario.apellidos}"></td>
					<td th:text="${usuario.email}"></td>
					<td>
						<a th:href="@{/usuarios/{id}/editar(id=${usuario.id})}" class="btn-icon"
							title="Editar">✏️</a>
						<form th:action="@{/usuarios/{id}/eliminar(id=${usuarios.id})}" method="post"
							onsubmit="return confirm('¿Eliminar este usuario?')">
							<button type="submit" class="btn-icon" title="Eliminar">🗑️</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>
</body>

</html>
