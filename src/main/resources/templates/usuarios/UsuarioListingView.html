<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Listado de Usuarios</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

<body th:classappend="${fondoSesion != null} ? 'fondo-sesion' : _" th:style="${fondoSesion != null} ? |--fondo-sesion-image: url('${fondoSesion}');| : _">

	<header>
		<h1>Listado de Usuarios</h1>
	</header>

	<main class="contenedor contenedor-listados">

		<p th:if="${mensaje}" th:text="${mensaje}" class="mensaje-destacado"></p>
		<p th:if="${error}" th:text="${error}" class="error" style="text-align:center;margin:0.5rem 0;"></p>

		<div class="acciones sticky-toolbar">
			<a th:href="@{/dashboard}" class="btn btn-primary">← Dashboard</a>
			<a th:href="@{/usuario/nuevo}" class="btn btn-primary">+ Registrar usuario</a>
		</div>
		
		<article class="card-listado" th:each="usuario : ${usuarios}">
			<div class="card-contenido">
				<h3 th:text="${usuario.nombre}"></h3>
			
				<p class="card-campo">
					<span class="card-label">Apellidos:</span>
					<span th:text="${usuario.apellidos}"></span>
				</p>
			
				<p class="card-campo">
					<span class="card-label">Email:</span>
					<span th:text="${usuario.email}"></span>
				</p>

				<p class="card-campo">
					<span class="card-label">Rol:</span>
					<span th:text="${usuario.rol}"></span>
				</p>
			</div>
		
			<div class="card-acciones">
				<a th:href="@{/admin/usuarios/{id}/editar(id=${usuario.id})}" class="btn btn-secondary btn-icon" title="Editar">
					<img th:src="@{/images/editar.png}" src="/images/editar.png" alt="" aria-hidden="true" class="btn-icon-img" />
					<span class="sr-only">Editar</span>
				</a>
		
				<form th:action="@{/admin/usuarios/{id}/eliminar(id=${usuario.id})}"
					  method="post"
					  class="form-eliminar"
					  data-confirm="¿Eliminar este usuario?">
					<button type="submit" class="btn btn-secondary btn-icon" title="Borrar">
						<img th:src="@{/images/borrar.png}" src="/images/borrar.png" alt="" aria-hidden="true" class="btn-icon-img" />
						<span class="sr-only">Borrar</span>
					</button>
				</form>
			</div>
		</article>
		
		<div th:if="${#lists.isEmpty(usuarios)}">
			<p>No hay usuarios registrados.</p>
		</div>
		
	</main>

	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>

	<script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
</body>

</html>
