<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title th:text="${accion} + ' usuario'">Formulario Usuario</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

<body th:classappend="${fondoSesion != null} ? 'fondo-sesion' : _" th:style="${fondoSesion != null} ? |--fondo-sesion-image: url('${fondoSesion}');| : _">

	<header>
		<h1 th:text="${accion} + ' usuario'">Formulario Usuario</h1>
	</header>

	<main class="contenedor">
		
		<div class="acciones sticky-toolbar">
			<th:block th:if="${accion == 'Editar'}">
				<a th:href="${adminEdicion != null && adminEdicion} ? @{/admin/usuarios} : @{/usuario/perfil}"
				   class="btn btn-secondary">Cancelar</a>
			</th:block>
			<th:block th:if="${accion == 'Añadir'}">
				<a th:if="${cancelarRegistro == 'ADMIN'}" th:href="@{/admin/usuarios}" class="btn btn-secondary">Cancelar</a>
				<a th:if="${cancelarRegistro == 'DASHBOARD'}" th:href="@{/dashboard}" class="btn btn-secondary">Cancelar</a>
				<a th:if="${cancelarRegistro == 'LOGIN'}" th:href="@{/login}" class="btn btn-secondary">Cancelar</a>
			</th:block>
			<button type="submit" form="usuarioForm" class="btn btn-primary">Guardar</button>
		</div>

		<div class="card">
			<form id="usuarioForm"
				  th:attr="autocomplete=${usuario.id == null ? 'off' : 'on'}"
				  th:action="${usuario.id != null}
                          ? (${adminEdicion != null && adminEdicion} ? @{/admin/usuarios/{id}/editar(id=${usuario.id})} : @{/usuario/{id}/editar(id=${usuario.id})})
                          : @{/usuario/nuevo}" th:object="${usuario}" method="post">

				<span th:if="${error}" th:text="${error}" class="error"></span>
				
				<div class="form-group">
					<label for="nombre">Nombre</label>
					<input type="text" id="nombre" th:field="*{nombre}" placeholder="Nombre"
						   th:attr="autocomplete=${usuario.id == null ? 'off' : 'given-name'}" />
					<span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
				</div>

				<div class="form-group">
					<label for="nombre">Apellidos</label>
					<input type="text" id="apellidos" th:field="*{apellidos}" placeholder="Apellidos"
						   th:attr="autocomplete=${usuario.id == null ? 'off' : 'family-name'}" />
					<span class="error" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></span>
				</div>

				<div class="form-group">
					<label for="email">Email</label>
					<input type="email" id="email" th:field="*{email}" placeholder="correo@ejemplo.com"
						   th:attr="autocomplete=${usuario.id == null ? 'off' : 'email'}" />
					<span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
				</div>

				<div class="form-group">
					<label for="password">Contraseña</label>
					<input type="password" id="password" th:field="*{password}" placeholder="Password /"
						   th:attr="autocomplete=${usuario.id == null ? 'new-password' : 'new-password'}" />
					<span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
				</div>

				<div class="form-group">
					<label for="repitePassword">Introduce de nuevo tu contraseña</label>
					<input type="password" id="repitePassword" th:field="*{repitePassword}" placeholder="Repite tu password"
						   th:attr="autocomplete=${usuario.id == null ? 'new-password' : 'new-password'}" />
					<span class="error" th:if="${#fields.hasErrors('repitePassword')}" th:errors="*{repitePassword}"></span>
				</div>

			</form>
		</div>
	</main>

	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>

	<script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
</body>

</html>
