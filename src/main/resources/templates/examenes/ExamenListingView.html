<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Listado de Exámenes</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

<body>

	<header>
		<h1>Listado de Exámenes</h1>
	</header>

	<main class="contenedor contenedor-listados">
		
		<div class="acciones sticky-toolbar">
			<a th:href="@{/dashboard}" class="btn btn-primary">← Dashboard</a>
			<a th:href="@{/examenes/nuevo}" class="btn btn-primary">+ Añadir examen</a>
		</div>

		<article class="card-listado"
         		 th:each="examen : ${examenes}"
         		 th:style="${examen.asignatura != null and examen.asignatura.color != null ? '--card-color:' + examen.asignatura.color : ''}">
			<div class="card-contenido">
				<h3 th:text="${examen.asignatura != null ? examen.asignatura.nombre : 'Sin asignatura'}"></h3>
			
				<p class="card-campo">
					<span class="card-label">Descripción:</span>
					<span th:text="${examen.descripcion}"></span>
				</p>
			
				<p class="card-campo">
					<span class="card-label">Fecha:</span>
					<span th:text="${#temporals.format(examen.fecha, 'dd/MM/yyyy')}"></span>
				</p>
			
				<p class="card-campo">
					<span class="card-label">Peso:</span>
					<span th:text="${examen.peso}"></span>
				</p>
			
				<p class="card-campo">
					<span class="card-label">Nota objetivo:</span>
					<span th:text="${examen.notaObjetivo}"></span>
				</p>
			</div>
		
			<div class="card-acciones">
				<a th:href="@{/examenes/{id}/editar(id=${examen.id})}" class="btn btn-secondary btn-icon" title="Editar">
					<img th:src="@{/images/editar.png}" src="/images/editar.png" alt="" aria-hidden="true" class="btn-icon-img" />
					<span class="sr-only">Editar</span>
				</a>
		
				<form th:action="@{/examenes/{id}/eliminar(id=${examen.id})}"
					  method="post"
					  class="form-eliminar"
					  data-confirm="¿Eliminar este examen?">
					<button type="submit" class="btn btn-secondary btn-icon" title="Borrar">
						<img th:src="@{/images/borrar.png}" src="/images/borrar.png" alt="" aria-hidden="true" class="btn-icon-img" />
						<span class="sr-only">Borrar</span>
					</button>
				</form>
			</div>
		</article>
		
		<div th:if="${#lists.isEmpty(examenes)}">
			<p>No tienes exámenes registrados.</p>
		</div>

	</main>

	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>

	<script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
</body>

</html>
