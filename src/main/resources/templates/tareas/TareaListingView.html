<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Listado de Tareas</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

<body>

	<header>
		<h1>Listado de Tareas</h1>
	</header>

	<main class="contenedor contenedor-listados">
		
		<div class="acciones sticky-toolbar">
			<a th:href="@{/dashboard}" class="btn btn-primary">← Dashboard</a>
			<a th:href="@{/tareas/nuevo}" class="btn btn-primary">+ Añadir tarea</a>
		</div>

		<article class="card-listado"
				 th:each="tarea : ${tareas}"
				 th:style="${tarea.asignatura != null and tarea.asignatura.color != null ? '--card-color:' + tarea.asignatura.color : ''}">
			<div class="card-contenido">
				<h3 th:text="${tarea.asignatura != null ? tarea.asignatura.nombre : 'Sin asignatura'}"></h3>
			
				<p class="card-campo">
					<span class="card-label">Descripción:</span>
					<span th:text="${tarea.descripcion}"></span>
				</p>
			
				<p class="card-campo">
					<span class="card-label">Fecha límite:</span>
					<span th:text="${#temporals.format(tarea.fechaLimite, 'dd/MM/yyyy')}"></span>
				</p>
			
				<p class="card-campo">
					<span class="card-label">Prioridad:</span>
					<span th:text="${tarea.prioridad}"></span>
				</p>
			
				<p class="card-campo">
					<span class="card-label">Estado:</span>
					<span th:text="${tarea.estado}"></span>
				</p>
			
				<p class="card-campo">
					<span class="card-label">Tiempo estimado:</span>
					<span th:text="${tarea.tiempoFormateado}"></span>
				</p>
			</div>
		
			<div class="card-acciones">
				<a th:href="@{/tareas/{id}/editar(id=${tarea.id})}" class="btn btn-secondary btn-icon" title="Editar">
					<img th:src="@{/images/editar.png}" src="/images/editar.png" alt="" aria-hidden="true" class="btn-icon-img" />
					<span class="sr-only">Editar</span>
				</a>
		
				<form th:action="@{/tareas/{id}/eliminar(id=${tarea.id})}"
					  method="post"
					  class="form-eliminar"
					  data-confirm="¿Eliminar esta tarea?">
					<button type="submit" class="btn btn-secondary btn-icon" title="Borrar">
						<img th:src="@{/images/borrar.png}" src="/images/borrar.png" alt="" aria-hidden="true" class="btn-icon-img" />
						<span class="sr-only">Borrar</span>
					</button>
				</form>
			</div>
		</article>
		
		<div th:if="${#lists.isEmpty(tareas)}">
			<p>No tienes tareas registradas.</p>
		</div>
		
	</main>

	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>

	<script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
</body>

</html>
