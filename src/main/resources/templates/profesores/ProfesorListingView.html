<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Listado de Profesores</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

<body>

	<header>
		<h1>Listado de Profesores</h1>
	</header>

	<div class="contenedor">
		<table>
			<thead>
				<tr>
					<th>Nombre</th>
					<th>Email</th>
					<th>Nº Asignaturas</th>
					<th>Acciones</th>
				</tr>
			</thead>
			<tbody>
				<tr th:if="${#lists.isEmpty(profesores)}">
					<td colspan="5" class="vacio">No tienes profesores registrados.</td>
				</tr>
				<tr th:each="profesor : ${profesores}">
					<td th:text="${profesor.nombre}"></td>
					<td th:text="${profesor.email}"></td>
					<td th:text="${#lists.size(profesor.asignaturas)}"></td>
					<td>
						<a th:href="@{/profesores/{id}/editar(id=${profesor.id})}" class="btn-icon"
							title="Editar">✏️</a>
						<form th:action="@{/profesores/{id}/eliminar(id=${profesor.id})}" method="post"
							onsubmit="return confirm('¿Eliminar este profesor?')">
							<button type="submit" class="btn-icon" title="Eliminar">🗑️</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

	<div class="barra-acciones">
		<a th:href="@{/dashboard}" class="btn btn-primary">← Dashboard</a>
		<a th:href="@{/profesores/nuevo}" class="btn btn-primary">+ Añadir profesor</a>
	</div>

	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>

	<script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
</body>

</html>
