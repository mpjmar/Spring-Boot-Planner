<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Listado de Profesores</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

<body>

	<header>
		<h1>Listado de Profesores</h1>
	</header>

	<main class="contenedor">
		<div class="acciones sticky-toolbar">
			<a th:href="@{/dashboard}" class="btn btn-primary">← Dashboard</a>
			<a th:href="@{/profesores/nuevo}" class="btn btn-primary">+ Añadir profesor</a>
		</div>
		
		<article class="card-listado" th:each="profesor : ${profesores}">
			<div class="card-contenido">
				<h3 th:text="${profesor.nombre}"></h3>
			
				<p class="card-campo">
					<span class="card-label">Email:</span>
					<span th:text="${profesor.email}"></span>
				</p>
			
				<p class="card-campo">
					<span class="card-label">Nº Asignaturas:</span>
					<span th:text="${#lists.size(profesor.asignaturas)}"></span>
				</p>
			</div>
		
			<div class="card-acciones">
				<a th:href="@{/profesores/{id}/editar(id=${profesor.id})}" class="btn btn-secondary">
					Editar
				</a>
		
				<form th:action="@{/profesores/{id}/eliminar(id=${profesor.id})}"
					  method="post"
					  class="form-eliminar"
					  data-confirm="¿Eliminar este profesor?">
					<button type="submit" class="btn btn-secondary">
						Borrar
					</button>
				</form>
			</div>
		</article>
		
		<div th:if="${#lists.isEmpty(profesores)}">
			<p>No tienes profesores registrados.</p>
		</div>

	</main>

	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>

	<script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
</body>

</html>
