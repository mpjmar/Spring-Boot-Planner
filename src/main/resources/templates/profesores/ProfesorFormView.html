<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title th:text="${accion} + ' profesor'">Formulario Profesor</title>
</head>

<body>

	<header>
		<h1 th:text="${accion} + ' profesor'">Formulario Profesor</h1>
	</header>

	<div class="contenedor">
		<div class="card">

			<!-- Si es edición, el action apunta a /{id}/editar; si es nuevo, a /nuevo -->
			<form th:action="${profesor.id != null}
                          ? @{/profesores/{id}/editar(id=${profesor.id})}
                          : @{/profesores/nuevo}" th:object="${profesor}" method="post">

				<div class="form-group">
					<label for="nombre">Nombre</label>
					<input type="text" id="nombre" th:field="*{nombre}" placeholder="Nombre completo" />
					<span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
				</div>

				<div class="form-group">
					<label for="email">Email</label>
					<input type="email" id="email" th:field="*{email}" placeholder="correo@ejemplo.com" />
					<span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
				</div>

				<div class="acciones">
					<a th:href="@{/profesores}" class="btn btn-secondary">← Cancelar</a>
					<button type="submit" class="btn btn-primary" th:text="${accion} + ' profesor'">Guardar</button>
				</div>

			</form>
		</div>
	</div>

	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>
</body>

</html>
