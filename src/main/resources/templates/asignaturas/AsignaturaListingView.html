<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Listado de Asignaturas</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

<body>

	<header>
		<h1>Listado de Asignaturas</h1>
	</header>

	<main class="contenedor contenedor-listados">

		<div class="acciones sticky-toolbar">
			<a th:href="@{/dashboard}" class="btn btn-primary">← Dashboard</a>
			<a th:href="@{/asignaturas/nuevo}" class="btn btn-primary">+ Añadir asignatura</a>
		</div>
		
		<article class="card-listado"
				 th:each="asignatura : ${asignaturas}"
				 th:style="${asignatura.color != null ? '--card-color:' + asignatura.color : ''}">
			<div class="card-contenido">
				<h3 th:text="${asignatura.nombre}"></h3>
				<p class="card-campo">
					<span class="card-label">Profesor:</span>
					<span th:text="${asignatura.profesor != null ? asignatura.profesor.nombre : '—'}"></span>
				</p>
				<img th:src="${asignatura.imagenUrl}" alt="imagen" class="card-imagen" />
			</div>
			<div class="card-acciones">
				<a th:href="@{/asignaturas/{id}/editar(id=${asignatura.id})}" class="btn btn-secondary btn-icon" title="Editar">
					<img th:src="@{/images/editar.png}" src="/images/editar.png" alt="" aria-hidden="true" class="btn-icon-img" />
					<span class="sr-only">Editar</span>
				</a>
				<form th:action="@{/asignaturas/{id}/eliminar(id=${asignatura.id})}"
					  method="post"
					  class="form-eliminar"
					  data-confirm="¿Eliminar esta asignatura?">
					<button type="submit" class="btn btn-secondary btn-icon" title="Borrar">
						<img th:src="@{/images/borrar.png}" src="/images/borrar.png" alt="" aria-hidden="true" class="btn-icon-img" />
						<span class="sr-only">Borrar</span>
					</button>
				</form>
			</div>
		</article>

		<div th:if="${#lists.isEmpty(asignaturas)}">
			<p>No tienes asignaturas registradas.</p>
		</div>
		
	</main>


	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>

	<script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
</body>

</html>
