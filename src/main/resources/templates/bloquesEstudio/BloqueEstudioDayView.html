<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title th:text="${pageTitle} ?: 'bloqueEstudio'">Cuadrante de estudio</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

<body class="fondo" th:classappend="${bodyClass}"
      th:classappend="${fondoSesion != null} ? 'fondo-sesion' : _" th:style="${fondoSesion != null} ? |--fondo-sesion-image: url('${fondoSesion}');| : _">

	<main class="contenedor">

	<header>
		<h2 th:text="'Cuadrante del ' + ${#temporals.format(fecha, 'EEEE dd-MM-yyyy')}"></h2>
	</header>
	
	<div class="acciones sticky-toolbar">
		<a th:href="@{/bloquesEstudio}" class="btn btn-primary">← Planificación</a>
		<a th:href="@{/bloquesEstudio/nuevo(fecha=${fecha})}" class="btn btn-primary">
			+ Añadir bloque de estudio
		</a>
	</div>

	<div class="bloques-grid">
		<div class="bloque-card"
			 th:each="bloque : ${bloquesEstudio}"
			 th:style="${bloque.asignatura != null and bloque.asignatura.color != null ? '--card-color:' + bloque.asignatura.color : ''}">
			<div class="card-contenido">
				<div class="bloques-horas">
					<span th:text="${bloque.horaInicio}"></span>
					<span> - </span>
					<span th:text="${bloque.horaFin}"></span>
				</div>
				<div class="bloque-asignatura">
					<span th:text="${bloque.asignatura != null ? bloque.asignatura.nombre : 'Sin bloques de estudio'}"></span>
				</div>
			</div>

			<div class="card-acciones">
				<button type="button"
						class="btn btn-secondary btn-editar btn-icon"
						th:attr="data-id=${bloque.id}"
						title="Editar">
					<img th:src="@{/images/editar.png}" src="/images/editar.png" alt="" aria-hidden="true" class="btn-icon-img" />
					<span class="sr-only">Editar</span>
				</button>

				<form th:action="@{/bloquesEstudio/{id}/eliminar(id=${bloque.id})}"
					method="post"
					class="form-eliminar"
					data-confirm="¿Eliminar este bloque de estudio?">
					<button type="submit" class="btn btn-secondary btn-icon" title="Borrar">
						<img th:src="@{/images/borrar.png}" src="/images/borrar.png" alt="" aria-hidden="true" class="btn-icon-img" />
						<span class="sr-only">Borrar</span>
					</button>
				</form>
			</div>

			<div th:id="'form-editar-' + ${bloque.id}" style="display:none;">
				<form th:action="@{/bloquesEstudio/{id}/editar(id=${bloque.id})}" method="post">
					<input type="hidden" name="id" th:value="${bloque.id}" />
					<input type="hidden" name="fecha" th:value="${bloque.fecha}" />
					<label>Hora inicio:
						<input type="time" name="horaInicio" th:value="${bloque.horaInicio}" />
					</label>
					<label>Hora fin:
						<input type="time" name="horaFin" th:value="${bloque.horaFin}" />
					</label>
					<label>Asignatura:
						<select name="asignatura.id">
							<option th:each="asig : ${asignaturas}" 
									th:value="${asig.id}" 
									th:text="${asig.nombre}" 
									th:selected="${bloque.asignatura != null and asig.id == bloque.asignatura.id}"></option>
						</select>
					</label>
					<button type="submit" class="btn btn-primary">Guardar</button>
					<button type="button"
							class="btn btn-secondary btn-small btn-cancelar"
							th:attr="data-id=${bloque.id}">
					Cancelar
					</button>
				</form>
			</div>
		</div>
	</div>

	<div class="navegacion-fecha">
		<!-- Día anterior -->
		<a th:href="@{/bloquesEstudio/dia(fecha=${fecha.minusDays(1)})}">⬅️</a>
		<!-- Hoy -->
		<a th:href="@{/bloquesEstudio/dia}">Hoy</a>
		<!-- Día siguiente -->
		<a th:href="@{/bloquesEstudio/dia(fecha=${fecha.plusDays(1)})}">➡️</a>
	</div>

</main>

	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>

	<script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
</body>

</html>
