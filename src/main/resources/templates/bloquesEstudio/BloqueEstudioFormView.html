<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title th:text="${accion} + ' bloqueEstudio'">Formulario Bloque de estudios</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

<body>

	<header>
		<h1 th:text="${accion} + ' bloqueEstudio'">Formulario Bloque de estudios</h1>
	</header>

	<div class="contenedor">
		<div class="card">

			<form th:action="${bloqueEstudio.id != null}
                          ? @{/bloqueEstudio/{id}/editar(id=${bloqueEstudio.id})}
                          : @{/bloqueEstudio/nuevo}" th:object="${bloqueEstudio}" method="post">

				<input type="hidden" name="cuadranteId" th:value="${bloqueEstudio.cuadrante != null ? bloqueEstudio.cuadrante.id : ''}" />

				<div class="form-group">
					<label for="fecha">Fecha</label>
					<input type="date" id="fecha" th:field="*{fecha}" th:value="${param.fecha}" />
				</div>

				<div class="form-group">
					<label for="horaInicio">Hora inicio</label>
					<input type="time" id="horaInicio" th:field="*{horaInicio}" th:value="${param.horaInicio}" />
					<span class="error" th:if="${#fields.hasErrors('horaInicio')}" th:errors="*{horaInicio}"></span>
				</div>

				<div class="form-group">
					<label for="horaFin">Hora fin</label>
					<input type="time" id="horaFin" th:field="*{horaFin}" th:value="${param.horaFin}" />
					<span class="error" th:if="${#fields.hasErrors('horaFin')}" th:errors="*{horaFin}"></span>
				</div>

				<div class="form-group">
					<label for="asignatura">Asignatura</label>
					<select id="asignatura" th:field="*{asignatura.id}" class="form-control">
						<option value="">-- Selecciona una asignatura --</option>
						<option th:each="asig : ${asignaturas}"
							th:value="${asig.id}"
							th:text="${asig.nombre}"
							th:selected="${asig.id == bloqueEstudio.asignatura?.id}">
						</option>
					</select>
					<span class="error" th:if="${#fields.hasErrors('asignatura') || #fields.hasErrors('asignatura.id')}" th:errors="*{asignatura}"></span>
				</div>

				<div class="acciones">
					<a th:href="@{/profesores}" class="btn btn-secondary">← Cancelar</a>
					<button type="submit" class="btn btn-primary" th:text="${accion} + ' profesor'">Guardar</button>
				</div>

			</form>
		</div>
	</div>

	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>
</body>

</html>
