<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Planificación semanal de estudio</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

  <body class="fondo" th:classappend="${bodyClass}">

    <main class="contenedor">

		<div class="acciones sticky-toolbar">
			<a th:href="@{/dashboard}" class="btn btn-primary">← Dashboard</a>
			<a th:href="@{/bloquesEstudio/nuevo}" class="btn btn-primary">+ Añadir bloque de estudio</a>
		</div>
		
		<div class="bloques-semana-header card">
			<h3>
				Semana del
				<span th:text="${#temporals.format(inicioSemana, 'dd/MM')}">01/01</span>
				al
				<span th:text="${#temporals.format(finSemana, 'dd/MM')}">07/01</span>
			</h3>
			<div class="navegacion-fecha">
				<a class="btn btn-secondary" th:href="@{/bloquesEstudio(weekStart=${semanaAnterior})}">← Semana anterior</a>
				<a class="btn btn-secondary" th:href="@{/bloquesEstudio}">Semana actual</a>
				<a class="btn btn-secondary" th:href="@{/bloquesEstudio(weekStart=${semanaSiguiente})}">Semana siguiente →</a>
			</div>
		</div>

		<section class="bloques-semana-grid">
			<article class="bloques-semana-columna" th:each="diaConBloques : ${diasConBloques}" th:with="dia=${diaConBloques.dia}">
				<header class="bloques-columna-header">
					<h3 th:text="${#temporals.format(dia, 'EEEE')}">Lunes</h3>
					<p th:text="${#temporals.format(dia, 'dd/MM')}">01/01</p>
					<span th:if="${dia.equals(hoy)}" class="badge-hoy">Hoy</span>
				</header>

				<a class="btn btn-secondary btn-small"
				   th:href="@{/bloquesEstudio/nuevo(fecha=${dia})}">
					+ Añadir bloque
				</a>

				<div class="bloques-dia-lista">
					<div th:if="${#lists.isEmpty(diaConBloques.bloques)}" class="texto-secundario">
						Sin bloques planificados.
					</div>

					<div class="bloque-card"
						 th:each="bloque : ${diaConBloques.bloques}"
						 th:style="${bloque.asignatura != null and bloque.asignatura.color != null ? '--card-color:' + bloque.asignatura.color : ''}">
						<div class="card-contenido">
							<div class="bloques-horas">
								<span th:text="${bloque.horaInicio}"></span>
								<span> - </span>
								<span th:text="${bloque.horaFin}"></span>
							</div>
					
							<div class="bloque-asignatura">
								<span th:text="${bloque.asignatura != null ? bloque.asignatura.nombre : 'Sin asignatura'}"></span>
							</div>
						</div>

						<div class="card-acciones">
							<a th:href="@{/bloquesEstudio/dia(fecha=${bloque.fecha})}" class="btn btn-secondary btn-small">
								Ver día
							</a>
						</div>
					</div>
				</div>
			</article>
		</section>
		
	</main>

	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>

	<script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
</body>

</html>
