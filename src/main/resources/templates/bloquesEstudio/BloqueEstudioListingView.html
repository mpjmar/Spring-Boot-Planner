<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Listado de Bloques de estudio</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

<body>

	<header>
		<h1>Listado de Bloques de estudio</h1>
	</header>

	<div class="contenedor">
		<div class="barra-acciones">
			<a th:href="@{/dashboard}" class="btn btn-primary">← Dashboard</a>
			<a th:href="@{/bloquesEstudio/nuevo}" class="btn btn-primary">+ Añadir bloque de estudio</a>
		</div>

		<table>
			<thead>
				<tr>
					<th>Fecha</th>
					<th>Hora inicio</th>
					<th>Hora fin</th>
					<th>Asignatura</th>
					<th>Acciones</th>
				</tr>
			</thead>
			<tbody>
				<tr th:if="${#lists.isEmpty(bloquesEstudio)}">
					<td colspan="5" class="vacio">No tienes bloques de estudio registrados.</td>
				</tr>
				<tr th:each="bloque : ${bloquesEstudio}">
					<td th:text="${#temporals.format(bloque.fecha, 'dd/MM/yyyy')}"></td>
					<td th:text="${bloque.horaInicio}"></td>
					<td th:text="${bloque.horaFin}"></td>
					<td th:text="${bloque.asignatura != null ? bloque.asignatura.nombre : '—'}"></td>
					<td>
						<a th:href="@{/bloquesEstudio/{id}/editar(id=${bloque.id})}" class="btn-icon"
							title="Editar">✏️</a>
						<form th:action="@{/bloquesEstudio/{id}/eliminar(id=${bloque.id})}" method="post"
							onsubmit="return confirm('¿Eliminar esta bloque de estudio?')">
							<button type="submit" class="btn-icon" title="Eliminar">🗑️</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>

	<script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
</body>

</html>
