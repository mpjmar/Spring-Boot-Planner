<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Listado de Bloques de estudio</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

<body>

	<header>
		<h1>Listado de Bloques de estudio</h1>
	</header>

	<div class="contenedor">
		<div class="navegacion-dias">
			<h3>Selecciona un día</h3>
			<div th:each="dia : ${diasSemana}">
				<a class="btn btn-diaSemana"
					th:href="@{/bloquesEstudio/dia/{diaSemana}(diaSemana=${dia})}"
					th:text="${dia.nombre}">
				</a>
			</div>
		</div>
	</div>

	<div class="barra-acciones">
		<a th:href="@{/dashboard}" class="btn btn-primary">← Dashboard</a>
	</div>

	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>

	<script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
</body>

</html>
