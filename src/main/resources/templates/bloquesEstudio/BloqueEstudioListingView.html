<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Listado de Bloques de estudio</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
	<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
</head>

  <body class="fondo" th:classappend="${bodyClass}">

    <main class="contenedor">

		<div class="acciones sticky-toolbar">
			<a th:href="@{/dashboard}" class="btn btn-primary">← Dashboard</a>
			<a th:href="@{/bloquesEstudio/nuevo}" class="btn btn-primary">+ Añadir bloque de estudio</a>
		</div>
		
		<div class="card">
			<h3>Selecciona un día</h3>
	
			<form th:action="@{/bloquesEstudio/dia}" method="get">
				<label for="fecha">Fecha</label>
				<input type="date" id="fecha" name="fecha" />
				<button type="submit" class="btn btn-primary">Ver día</button>
			</form>

			<div id="calendar"></div>

			<section class="bloques-dia">
				<h3>Bloques reservados</h3>
			
				<div th:if="${#lists.isEmpty(bloquesEstudio)}">
					No hay bloques de estudio planificados.
				</div>
			
				<div class="bloque-card"
					 th:each="bloque : ${bloquesEstudio}"
					 th:style="${bloque.asignatura != null and bloque.asignatura.color != null ? '--card-color:' + bloque.asignatura.color : ''}">
					<div class="card-contenido">
						<div class="bloques-fecha"
							 th:text="${#temporals.format(bloque.fecha, 'EEEE dd-MM-yyyy')}">
						</div>
				
						<div class="bloques-horas">
							<span th:text="${bloque.horaInicio}"></span>
							<span> - </span>
							<span th:text="${bloque.horaFin}"></span>
						</div>
				
						<div class="bloque-asignatura">
							<span th:text="${bloque.asignatura != null ? bloque.asignatura.nombre : 'Sin asignatura'}"></span>
						</div>
					</div>

					<div class="card-acciones">
						<a th:href="@{/bloquesEstudio/dia(fecha=${bloque.fecha})}" class="btn btn-secondary">
							Ver día
						</a>
					</div>
				</div>
			</section>
		</div>
		
	</main>

	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>	
	<script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
</body>

</html>
