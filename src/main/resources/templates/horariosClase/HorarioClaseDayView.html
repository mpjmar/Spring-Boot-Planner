<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${pageTitle} ?: 'horarioClase'">Horario clases</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css"/>
  </head>

  <body class="fondo" th:classappend="${bodyClass}"
        th:classappend="${fondoSesion != null} ? 'fondo-sesion' : _" th:style="${fondoSesion != null} ? |--fondo-sesion-image: url('${fondoSesion}');| : _">

    <main class="contenedor">
		
		<header>
			<h2 th:text="'Horario del día: ' + ${diaLectivo}"></h2>
		</header>

		<div class="acciones sticky-toolbar">
			<a th:href="@{/horariosClase}" class="btn btn-primary">← Horarios</a>
			<a th:href="@{/horariosClase/nuevo(diaLectivo=${diaLectivo})}" class="btn btn-primary">
				+ Añadir horario de clase
			</a>
		</div>
		
		<div class="horarios-grid">
			<div class="horario-card"
				 th:each="horario : ${horariosClase}"
				 th:style="${horario.asignatura != null and horario.asignatura.color != null ? '--card-color:' + horario.asignatura.color : ''}">
				<div class="horario-horas">
					<span th:text="${horario.horaInicio}"></span>
					<span> - </span>
					<span th:text="${horario.horaFin}"></span>
				</div>
				<div class="horario-asignatura">
					<span th:text="${horario.asignatura != null ? horario.asignatura.nombre : 'Sin asignatura'}"></span>
				</div>

				<div class="card-acciones">	
					<button type="button"
							class="btn btn-secondary btn-editar btn-icon"
							th:attr="data-id=${horario.id}"
							title="Editar">
						<img th:src="@{/images/editar.png}" src="/images/editar.png" alt="" aria-hidden="true" class="btn-icon-img" />
						<span class="sr-only">Editar</span>
					</button>

					<form th:action="@{/horariosClase/{id}/eliminar(id=${horario.id})}"
						method="post"
						class="form-eliminar"
						data-confirm="¿Eliminar este horario de clase?">
						<button type="submit" class="btn btn-secondary btn-icon" title="Borrar">
							<img th:src="@{/images/borrar.png}" src="/images/borrar.png" alt="" aria-hidden="true" class="btn-icon-img" />
							<span class="sr-only">Borrar</span>
						</button>
					</form>
				</div>
				
				<div th:id="'form-editar-' + ${horario.id}" style="display:none;">
					<form th:action="@{/horariosClase/{id}/editar(id=${horario.id})}" method="post">
						<input type="hidden" name="id" th:value="${horario.id}" />
						<input type="hidden" name="diaLectivo" th:value="${horario.diaLectivo}" />
						<label>Hora inicio:
							<select name="horaInicio">
								<option th:each="hora : ${horasInicioDisponibles}"
										th:value="${hora}"
										th:text="${hora}"
										th:selected="${hora == horario.horaInicio}">
								</option>
								<option th:if="${!#lists.contains(horasInicioDisponibles, horario.horaInicio)}"
										th:value="${horario.horaInicio}"
										th:text="${horario.horaInicio}"
										selected>
								</option>
							</select>
							</label>
							<label>Hora fin:
							<select name="horaFin">
								<option th:each="hora : ${horasFinDisponibles}"
										th:value="${hora}"
										th:text="${hora}"
										th:selected="${hora == horario.horaFin}">
								</option>
								<option th:if="${!#lists.contains(horasFinDisponibles, horario.horaFin)}"
										th:value="${horario.horaFin}"
										th:text="${horario.horaFin}"
										selected>
								</option>
							</select>
						</label>
						<label>Asignatura:
							<select name="asignaturaId">
								<option th:each="asig : ${asignaturas}" 
										th:value="${asig.id}" 
										th:text="${asig.nombre}" 
										th:selected="${horario.asignatura != null and asig.id == horario.asignatura.id}"></option>
							</select>
						</label>
						<button type="submit" class="btn btn-primary">Guardar</button>
						<button type="button"
								class="btn btn-secondary btn-small btn-cancelar"
								th:attr="data-id=${horario.id}">
						Cancelar
						</button>
					</form>
				</div>
			</div>
		</div>
    </main>

	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>

	<script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
  </body>
</html>
