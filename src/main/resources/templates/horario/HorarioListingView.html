<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${pageTitle} ?: 'Horario'">Horario clases</title>
    <link
      rel="stylesheet"
      th:href="@{/css/styles.css}"
      href="/css/styles.css"
    />
  </head>
  <body class="fondo" th:classappend="${bodyClass}">
    <main class="contenedor">
      <div class="tabla-wrapper">
        <table aria-label="Horario semanal">
          <tr>
            <th
              class="titulo-tabla"
              colspan="6"
              th:text="${tituloHorario} ?: 'Horario Semanal'"
            >
              Horario Semanal
            </th>
          </tr>
          <tr>
            <th class="col-hora">HORA</th>
            <th class="col-dia">LUNES</th>
            <th class="col-dia">MARTES</th>
            <th class="col-dia">MIÉRCOLES</th>
            <th class="col-dia">JUEVES</th>
            <th class="col-dia">VIERNES</th>
          </tr>

          <tr>
            <td class="col-hora">8:15 - 9:15</td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
          </tr>

          <tr>
            <td class="col-hora">9:15 - 10:15</td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
          </tr>

          <tr>
            <td class="col-hora">10:15 - 11:15</td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
          </tr>

          <tr>
            <td class="col-hora">11:15 - 11:45</td>
            <td class="descanso" colspan="5">Descanso</td>
          </tr>

          <tr>
            <td class="col-hora">11:45 - 12:45</td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
          </tr>

          <tr>
            <td class="col-hora">12:45 - 13:45</td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
          </tr>

          <tr>
            <td class="col-hora">12:45 - 13:45</td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
            <td class="materia"></td>
          </tr>
        </table>
      </div>
    </main>
  </body>
</html>
