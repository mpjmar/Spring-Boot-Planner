<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Dashboard</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

<body>
	<header>
		<h1>¡Bienvenido! <span th:text="${#authentication?.name}">Usuario</span></h1>
	</header>

	<main class="contenedor">
		<section class="card">
			<h2>¿Qué quieres hacer hoy?</h2>

			<nav class="dashboard-grid">
				<a th:href="@{/asignaturas}" class="card-listado dashboard-card">
					<span class="dashboard-icono">📘</span>
					<span>Asignaturas</span>
				</a>

				<a th:href="@{/profesores}" class="card-listado dashboard-card">
					<span class="dashboard-icono">🎓</span>
					<span>Profesores</span>
				</a>

				<a th:href="@{/tareas}" class="card-listado dashboard-card">
					<span class="dashboard-icono">📝</span>
					<span>Tareas</span>
				</a>

				<a th:href="@{/examenes}" class="card-listado dashboard-card">
					<span class="dashboard-icono">📄</span>
					<span>Exámenes</span>
				</a>

				<a th:href="@{/horariosClase}" class="card-listado dashboard-card">
					<span class="dashboard-icono">🕒</span>
					<span>Horarios de clase</span>
				</a>

				<a th:href="@{/bloquesEstudio}" class="card-listado dashboard-card">
					<span class="dashboard-icono">📅</span>
					<span>Cuadrantes de planificación</span>
				</a>
			</nav>
		</section>

		<form th:action="@{/logout}" method="post" class="acciones">
			<button type="submit" class="btn btn-secondary">Cerrar sesión</button>
		</form>
	</main>

	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>

	<script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
</body>

</html>
