<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Listado de Cuadrantes</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>

<body>
	<div class="contenedor">
		<h1>Mis cuadrantes</h1>
		<div class="barra-acciones">
			<a th:href="@{/dashboard}" class="btn btn-primary">← Dashboard</a>
			<a th:href="@{/cuadrantes/nuevo}" class="btn btn-primary">+ Nuevo cuadrante</a>
		</div>
		<table>
			<thead>
				<tr>
					<th>Nombre</th>
					<th>Fecha</th>
					<th>Descripción</th>
					<th>Acciones</th>
				</tr>
			</thead>
			<tbody>
				<tr th:if="${#lists.isEmpty(cuadrantes)}">
					<td colspan="5" class="vacio">No tienes cuadrantes registrados.</td>
				</tr>
				<tr th:each="cuadrante : ${cuadrantes}">
					<td th:text="${cuadrante.nombre}"></td>
					<td th:text="${cuadrante.diaInicio}"></td>
					<td th:text="${cuadrante.diaFin}"></td>
					<td th:text="${cuadrante.descripcion}"></td>
					<td>
						<a th:href="@{/cuadrantes/{id}/editar(id=${cuadrante.id})}" class="btn-icon"
							title="Ver/Editar">🗓️</a>
						<form th:action="@{/cuadrantes/{id}/eliminar(id=${cuadrante.id})}" method="post"
							style="display:inline;" onsubmit="return confirm('¿Eliminar este cuadrante?')">
							<button type="submit" class="btn-icon" title="Eliminar">🗑️</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
	<footer>
		<p>Planificador de estudios con Spring Boot + Supabase</p>
		<p>Author: M. Paz Jiménez Martín</p>
	</footer>
</body>

</html>
