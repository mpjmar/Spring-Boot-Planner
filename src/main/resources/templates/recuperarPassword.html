<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

<body class="auth-page" th:classappend="${fondoSesion != null} ? 'fondo-sesion' : _" th:style="${fondoSesion != null} ? |--fondo-sesion-image: url('${fondoSesion}');| : _">
    <main class="contenedor auth-main">
        <section class="card auth-card">
            <h1>Recuperar contraseña</h1>

            <p class="texto-secundario">
                Introduce tu email y te enviaremos un enlace para restablecer tu contraseña.
            </p>

            <form th:action="@{/recuperar-password}" method="post">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required />
                </div>

                <div th:if="${mensaje}" class="mensaje-exito">
                    <p th:text="${mensaje}"></p>
                </div>

                <div class="acciones">
                    <button type="submit" class="btn btn-primary">Enviar enlace</button>
                    <a th:href="@{/login}" class="btn btn-secondary">Volver al login</a>
                </div>
            </form>
        </section>
    </main>

    <script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
</body>

</html>
