<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restablecer contraseña</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

<body>
    <main class="contenedor">
        <section class="card">
            <h1>Restablecer contraseña</h1>

            <p class="texto-secundario">
                Introduce tu nueva contraseña para recuperar el acceso a tu cuenta.
            </p>

            <form th:action="@{/restablecer-password}" method="post">
                <input type="hidden" name="token" th:value="${token}" />

                <div class="form-group">
                    <label for="password">Nueva contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Nueva contraseña" required />
                </div>

                <div th:if="${error}" class="error">
                    <p th:text="${error}"></p>
                </div>

                <div th:if="${mensaje}" class="mensaje-exito">
                    <p th:text="${mensaje}"></p>
                </div>

                <div class="acciones">
                    <button type="submit" class="btn btn-primary">Guardar contraseña</button>
                    <a th:href="@{/login}" class="btn btn-secondary">Volver al login</a>
                </div>
            </form>
        </section>
    </main>

    <script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
</body>

</html>
