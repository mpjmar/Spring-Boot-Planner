<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restablecer password</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css" />
</head>

<body class="auth-page" th:classappend="${fondoSesion != null} ? 'fondo-sesion' : _" th:style="${fondoSesion != null} ? |--fondo-sesion-image: url('${fondoSesion}');| : _">
    <main class="contenedor auth-main">
        <section class="card auth-card">
            <h1>Restablecer password</h1>

            <p class="texto-secundario">
                Introduce tu nueva password para recuperar el acceso a tu cuenta.
            </p>

            <form th:action="@{/restablecer-password}" method="post">
                <input type="hidden" name="token" th:value="${token}" />

                <div class="form-group">
                    <label for="password">Nueva password</label>
                    <input type="password" id="password" name="password" placeholder="Nueva password" required />
                </div>

                <div class="form-group">
                    <label for="repite-password">Repite password</label>
                    <input type="password" id="repite-password" name="repitePassword" placeholder="Repite password" required />
                </div>

                <div th:if="${error}" class="error">
                    <p th:text="${error}"></p>
                </div>

                <div th:if="${mensaje}" class="mensaje-exito">
                    <p th:text="${mensaje}"></p>
                </div>

                <div class="acciones">
                    <button type="submit" class="btn btn-primary">Guardar password</button>
                    <a th:href="@{/login}" class="btn btn-secondary">Volver al login</a>
                </div>
            </form>
        </section>
    </main>

    <script th:src="@{/javascript/script.js}" src="/javascript/script.js"></script>
</body>

</html>
